name: GolkoyHaber APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: GölköyHaber proje ZIP'ini aç
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"

          if [ -z "$ZIP" ]; then
            echo "HATA: GölköyHaber proje ZIP'i bulunamadı."
            exit 1
          fi

          rm -rf /tmp/golkoy_extract /tmp/golkoy_project
          mkdir -p /tmp/golkoy_extract /tmp/golkoy_project

          unzip -q -o "$ZIP" -d /tmp/golkoy_extract

          SETTINGS="$(find /tmp/golkoy_extract -type f \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) -print -quit)"

          if [ -z "$SETTINGS" ]; then
            echo "HATA: settings.gradle(.kts) bulunamadı."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] && [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "HATA: app/build.gradle(.kts) bulunamadı."
            exit 1
          fi

          cp -a "$PROJECT_DIR/." /tmp/golkoy_project/

          echo "PROJECT_DIR=/tmp/golkoy_project" >> "$GITHUB_ENV"

      - name: APK derle
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: APK kontrol
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find "$PROJECT_DIR/app/build/outputs" -type f -name '*.apk' -print -quit)"

          if [ -z "$APK" ]; then
            echo "HATA: APK oluşmadı."
            exit 1
          fi

          ls -lh "$APK"

      - name: APK artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: GolkoyHaber-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
